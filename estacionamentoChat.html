<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parkify</title>
<style>
/* Fonte fofinha */
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap');

/* Body */
body {
    margin: 0;
    padding: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ffe4ec, #ffd6f0);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    flex-direction: column;
}

/* Card vertical */
.container {
    background: white;
    padding: 40px 30px;
    border-radius: 30px;
    box-shadow: 0 15px 40px rgba(255, 105, 180, 0.2);
    width: 320px;
    text-align: center;
    animation: fadeIn 1s ease;
    position: relative;
}

/* FadeIn */
@keyframes fadeIn {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
}

/* Título */
h1 {
    font-size: 48px;
    margin-bottom: 5px;
    background: linear-gradient(90deg, #ff4da6, #ff85c1);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: brilho 2s infinite alternate;
}

/* Brilho no título */
@keyframes brilho {
    from {text-shadow: 0 0 5px #ff85c1;}
    to {text-shadow: 0 0 20px #ff4da6;}
}

/* Subtítulo */
h2 {
    color: #d63384;
    margin-top: 0;
    font-weight: 500;
}

/* Texto */
h3 {
    font-size: 14px;
    color: #666;
    font-weight: 300;
    margin-bottom: 20px;
}

/* Labels */
label {
    display: block;
    margin: 10px 0 5px;
    font-weight: 500;
    color: #c2185b;
}

/* Inputs */
input[type="number"] {
    width: 80%;
    padding: 10px;
    border-radius: 15px;
    border: 2px solid #ffb6d9;
    outline: none;
    transition: 0.3s;
}

/* Foco no input */
input[type="number"]:focus {
    border-color: #ff4da6;
    box-shadow: 0 0 10px #ffc1e3;
}

/* Checkbox */
input[type="checkbox"] {
    transform: scale(1.3);
    accent-color: #ff4da6;
    margin-top: 5px;
}

/* Botão */
input[type="button"] {
    margin-top: 20px;
    background: linear-gradient(90deg, #ff4da6, #ff85c1);
    border: none;
    padding: 12px 30px;
    border-radius: 30px;
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 5px 15px rgba(255, 105, 180, 0.4);
}

/* Hover botão */
input[type="button"]:hover {
    transform: scale(1.08);
    box-shadow: 0 8px 20px rgba(255, 105, 180, 0.6);
}

/* Clique botão */
input[type="button"]:active {
    transform: scale(0.95);
}

/* Resultado */
#resp {
    display: block;
    margin-top: 15px;
    font-size: 20px;
    font-weight: bold;
    color: #ad1457;
    animation: aparecer 0.5s ease;
}

/* Animação resultado */
@keyframes aparecer {
    from {opacity: 0; transform: scale(0.8);}
    to {opacity: 1; transform: scale(1);}
}

/* Corações flutuando */
body::after {
    content: "💖 💕 💗 💓";
    position: absolute;
    top: 0;
    left: 0;
    font-size: 20px;
    animation: flutuar 6s infinite linear;
    opacity: 0.6;
}

@keyframes flutuar {
    0% {transform: translateY(0);}
    100% {transform: translateY(100vh);}
}
</style>
</head>
<body>

<div class="container">
    <h1>Parkify</h1>
    <h2>Seu carro merece esse cuidado.</h2>
    <h3>Pensando no seu conforto, o Parkify oferece uma navegação intuitiva e um sistema eficiente, permitindo que você economize tempo e evite preocupações. Com o Parkify, estacionar nunca foi tão fácil!</h3>

    <label for="inputHoras">Horas Estacionadas:</label>
    <input type="number" id="inputHoras">

    <label for="inputVeiculo">Veículo Grande?</label>
    <input type="checkbox" id="inputVeiculo">

    <label for="inputFrequencia">Cliente Frequente?:</label>
    <input type="checkbox" id="inputFrequencia">

    <input type="button" value="Calcular" onclick="Calcular()">

    <span id="resp"></span>
</div>

<script>
function Calcular() {
    let horas = Number(document.getElementById("inputHoras").value);
    let veiculoGrande = document.getElementById("inputVeiculo").checked;
    let clienteFrequente = document.getElementById("inputFrequencia").checked;
    let valor = 0;

    if (horas <= 0 || isNaN(horas)) {
        document.getElementById("resp").innerText = "Digite um valor válido de horas.";
        return;
    }

    if (horas >= 24) {
        let diarias = Math.floor(horas / 24);
        let horasRestantes = horas % 24;
        valor = diarias * 60;
        if (horasRestantes > 0) {
            valor += 5;
            if (horasRestantes > 1) valor += (horasRestantes - 1) * 2.5;
        }
    } else {
        valor = 5;
        if (horas > 1) valor += (horas - 1) * 2.5;
    }

    if (veiculoGrande) valor *= 1.25;
    if (clienteFrequente) valor *= 0.95;

    document.getElementById("resp").innerText = "O valor total é R$ " + valor.toFixed(2);
}
</script>

</body>
</html>
